; Clean Breeding settings. Keep this file UTF-8 without BOM (a BOM breaks GetPrivateProfileStringW).
; The in-game menu (F8) rewrites this file. Edit by hand only while the game is closed.

[breeding]
; 0 = Vanilla, 1 = Mild, 2 = None, 3 = Hard
inbreeding=0
heredity=0

[cleanse]
; disorders | defects | all
mode=all

[whitelist]
; Traits never hidden, removed, amplified or cleansed. Comma separated.
;
; Disorders (keys from data/passives/disorders.gon):
;   EternalYouth            fountain event, cat stays a kitten
;   SavantSyndrome          INT +12
;   Chungus                 CON +4, no downside
;   BrainDead               MonkeyPaw wish: double level-up stats, +1 reroll
;   Gargantuan              MonkeyPaw wish: STR +10 CON +5, immobile
;   TamperedGenes           MonkeyPaw wish: random mutation after each battle
;   SensoryOverload*        MonkeyPaw wishes: one equipment slot's effects tripled
;   DarkOne                 Demonic Idol event
;   BlessingOfGlorg         event: can unequip cursed items
disorders=EternalYouth,SavantSyndrome,Chungus,BrainDead,Gargantuan,TamperedGenes,SensoryOverloadFace,SensoryOverloadTrinket,SensoryOverloadHead,SensoryOverloadNeck,SensoryOverloadWeapon,DarkOne,BlessingOfGlorg
;
; Birth-defect body parts as <group>:<id> (group = file name in data/mutations/):
;   head:704     Cyclops: spells cost 1 less mana (20% miss chance)
;   tail:704     Forked tail: Hunter abilities offered on level up
;   texture:703  Blue spots: Mage abilities offered on level up
;   texture:704  Red dots: Fighter abilities offered on level up
;   texture:705  Jaundice: Thief abilities offered on level up
defects=head:704,tail:704,texture:703,texture:704,texture:705

[debug]
; Test helper: once per game launch, raise house food and gold to at least this value (never lowers). 0 = off.
test_resources=150
; Test helper: write disorders into live cats at launch. key:slot(0|1):DisorderName:level, comma separated. Empty = off.
test_disorders=955:1:Flu:1,959:0:Pox:1,959:1:CommonCold:1,965:1:Stinky:1,969:0:Fidgety:1,969:1:Dyslexia:1,958:1:Insomnia:1,961:0:Hypersomnia:1,961:1:Flu:1,963:1:Pox:1,972:0:Stinky:1,972:1:CommonCold:1
