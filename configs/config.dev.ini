; Clean Breeding settings. Keep this file UTF-8 without BOM (a BOM breaks GetPrivateProfileStringW).
; The in-game menu (F8) rewrites this file. Edit by hand only while the game is closed.

[breeding]
; Values: 0 = Normal, 1 = Reduced, 2 = Off, 3 = Increased
; inbreeding = "Inbreeding penalties", heredity = "Inherited flaws" in the menu.
inbreeding=0
heredity=0

[debug]
; Test helper: once per game launch, raise house food and gold to at least this value (never lowers). 0 = off.
test_resources=150
; Test helper: write disorders into live cats at launch. key:slot(0|1):DisorderName:level, comma separated. Empty = off.
test_disorders=955:1:Flu:1,959:0:Pox:1,959:1:CommonCold:1,965:1:Stinky:1,969:0:Fidgety:1,969:1:Dyslexia:1,958:1:Insomnia:1,961:0:Hypersomnia:1,961:1:Flu:1,963:1:Pox:1,972:0:Stinky:1,972:1:CommonCold:1
; Test helper: queue simulator runs at launch. keyA:keyB:coi:N separated by ';'. Results go to the Mewjector log. Empty = off.
test_simulation=
